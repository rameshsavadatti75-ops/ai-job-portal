<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Alva's College Student Career Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Inter, system-ui, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #061a44 0%, #0d3b8e 55%, #1d63dc 100%);
        }
        .reset-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.28);
        }
        h2 { font-size: 22px; color: #0f172a; margin-bottom: 6px; text-align: center; }
        p.sub { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 18px; }
        .alert-error {
            background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
            padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 14px; text-align: center;
        }
        label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        input {
            width: 100%; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 10px;
            font-size: 14px; margin-bottom: 14px; outline: none;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .btn-submit {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #1d63dc 0%, #0d47b8 100%);
            color: #ffffff; font-size: 14.5px; font-weight: 600; cursor: pointer;
        }
        .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #1d4ed8; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2>Set New Password</h2>
        <p class="sub">{% if email %}Resetting password for <strong>{{ email }}</strong>{% else %}Enter your new password below{% endif %}</p>

        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}

        {% if email %}
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" required>

            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>

            <button type="submit" class="btn-submit">Update Password</button>
        </form>
        {% endif %}

        <a href="{{ url_for('auth.login') }}" class="back-link">&larr; Back to Login</a>
    </div>
</body>
</html>
